<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Decode speed on one machine, from 9.89 to 25.57 tokens per second</title>
<desc id="d">Median tokens per second at each step on exact kernels, against a goal of 30. All values are in the table in README.md.</desc>
