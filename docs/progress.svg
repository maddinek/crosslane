<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Decode speed on one machine, from 9.89 to 26.27 tokens per second</title>
<desc id="d">Thirteen recorded setups on the same model and machine, using exact kernels without speculation. Earlier rows are medians of three answers at 8,192 tokens; the final a17 VRAM-rebalanced ROCm 7.2.1 row is the median of ten answers at 11,900 tokens, range 25.93 to 26.42. Placement and answer streams differ. Goal 30 remains unreached. Values are in README.md.</desc>
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.bar{fill:#2a78d6}.grid{stroke:#e4e3df}.goal{stroke:#52514e}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.bar{fill:#3987e5}.grid{stroke:#3a3a37}.goal{stroke:#c3c2b7}}</style>
<rect class="bg" width="760" height="462" rx="8"/>
